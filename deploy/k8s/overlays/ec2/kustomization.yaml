apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# botchat on the EC2 instance's k3s: the base, plus HTTPS, RDS's CA and the AWS settings.
resources:
  - ../../base
  - letsencrypt.yaml
  - ingress.yaml
  - network-policies.yaml

configMapGenerator:
  - name: game
    namespace: botchat
    behavior: merge
    literals:
      - EVENTS=sns
      - AWS_REGION=us-east-1
      - GAME_EVENTS_TOPIC_ARN=arn:aws:sns:us-east-1:867169974753:game-events
  - name: chat
    namespace: botchat
    behavior: merge
    literals:
      - PHX_HOST=botchat.chetbramble.com
      - AWS_REGION=us-east-1
      - LEVEL_QUEUE_URL=https://sqs.us-east-1.amazonaws.com/867169974753/level-updates
      - NOTICES_QUEUE_URL=https://sqs.us-east-1.amazonaws.com/867169974753/chat-notices
      - DB_CA_FILE=/etc/rds/global-bundle.pem
  # Amazon's public CA bundle for RDS, so both services can verify the database.
  - name: rds-ca
    namespace: botchat
    files:
      - global-bundle.pem

patches:
  # Mount that bundle into chat (both containers) and the game.
  - path: rds-ca-mounts.yaml
  # Every service account pulls images with the ECR secret that deploy.sh refreshes.
  - path: pull-secret.yaml

# Which image each Deployment runs. scripts/deploy.sh updates newTag.
images:
  - name: chat
    newName: 867169974753.dkr.ecr.us-east-1.amazonaws.com/botchat/chat
    newTag: "db4218af5c56"
  - name: game
    newName: 867169974753.dkr.ecr.us-east-1.amazonaws.com/botchat/game
    newTag: "ca4d71f5f82c"
  - name: bots
    newName: 867169974753.dkr.ecr.us-east-1.amazonaws.com/botchat/bots
    newTag: "none"
