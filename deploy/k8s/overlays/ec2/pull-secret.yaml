# A strategic merge patch on the base's service accounts: pods inherit imagePullSecrets
# from their service account, so no Deployment needs to name the secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chat
  namespace: botchat
imagePullSecrets:
  - name: ecr
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: game
  namespace: botchat
imagePullSecrets:
  - name: ecr
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bots
  namespace: botchat
imagePullSecrets:
  - name: ecr
