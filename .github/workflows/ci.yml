name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read      # paths-filter reads the PR's changed files

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      chat: ${{ steps.filter.outputs.chat }}
      game: ${{ steps.filter.outputs.game }}
      proto: ${{ steps.filter.outputs.proto }}
      bots: ${{ steps.filter.outputs.bots }}
      lambda: ${{ steps.filter.outputs.lambda }}
      infra: ${{ steps.filter.outputs.infra }}
      deploy: ${{ steps.filter.outputs.deploy }}
      lake: ${{ steps.filter.outputs.lake }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            chat:
              - 'chat/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
            game:
              - 'game/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
            proto:
              - 'proto/**'
              - 'buf.yaml'
              - 'buf.gen.yaml'
            bots:
              - 'bots/**'
              - '.github/workflows/ci.yml'
            lambda:
              - 'lambdas/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'
            deploy:
              - 'deploy/**'
              - 'scripts/**'
              - 'infra/k3s-init.sh'
              - '.github/workflows/ci.yml'
            lake:
              - 'analytics/lake/**'
              - '.github/workflows/ci.yml'

  # Runs on every pull request, whatever changed.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }   # full history, so every commit in the PR is scanned
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  chat:
    needs: changes
    if: needs.changes.outputs.chat == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5434:5432"]   # host port matches chat/config/test.exs
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-retries 20
    env:
      MIX_ENV: test
    defaults: { run: { working-directory: chat } }
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with: { otp-version: "28", elixir-version: "1.20" }   # match .mise.toml
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  # Real-browser tests against a running dev viewer. Not in ci-ok's needs,
  # so a failure here shows on the PR but doesn't block the merge.
  chat-browser:
    needs: changes
    if: needs.changes.outputs.chat == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5434:5432"]   # host port matches chat/config/dev.exs
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-retries 20
    defaults: { run: { working-directory: chat } }
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check scripts test/browser
      - run: uvx ruff format --check scripts test/browser
      - uses: erlef/setup-beam@v1
        with: { otp-version: "28", elixir-version: "1.20" }   # match .mise.toml
      - run: mix setup   # deps, the seeded dev database and built assets
      - run: uv run --with pytest-playwright playwright install --with-deps chromium
      - name: Start the viewer
        run: |
          mix phx.server > phx.log 2>&1 &
          timeout 60 sh -c 'until curl -sf http://localhost:4000/c/general > /dev/null; do sleep 1; done'
      - run: uv run --with pytest-playwright pytest test/browser
      - if: failure()
        run: cat phx.log

  game:
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-retries 20
    env:
      # Without this the XP store's integration tests skip themselves.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    defaults: { run: { working-directory: game } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with: { go-version-file: game/go.mod, cache-dependency-path: game/go.sum }
      - run: test -z "$(gofmt -l .)"     # fails if any file isn't gofmt-ed
      - run: go vet ./...
      - run: go test -race ./...

  proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bufbuild/buf-action@v1
        with:
          push: false
          # The summary comment needs pull-requests: write, which this workflow doesn't grant.
          pr_comment: false
          breaking_against: "${{ github.event.repository.clone_url }}#branch=main"

  bots:
    needs: changes
    if: needs.changes.outputs.bots == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: bots } }
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0   # v8 has no moving major tag: pin a full version
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest

  lambda:
    needs: changes
    if: needs.changes.outputs.lambda == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: lambdas/announcer } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with: { go-version-file: lambdas/announcer/go.mod, cache-dependency-path: lambdas/announcer/go.sum }
      - run: go vet ./... && go test ./...
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -tags lambda.norpc -o bootstrap .

  # Format and validate only: plan and apply need AWS credentials, which stay off CI.
  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      # lambda.tf hashes the announcer's zip, a build output Git ignores; validate
      # only needs the file to exist.
      - run: touch ../lambdas/announcer/function.zip
      - run: terraform init -backend=false && terraform validate

  # The manifests must render and the scripts must parse.
  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # kubectl (with kustomize built in) is preinstalled on GitHub's Ubuntu runners.
      - run: kubectl kustomize deploy/k8s/overlays/local > /dev/null
      - run: kubectl kustomize deploy/k8s/overlays/ec2 > /dev/null
      - run: for s in scripts/*.sh infra/k3s-init.sh; do bash -n "$s"; done

  # The DAG test skips itself here (no Airflow); it runs inside the image.
  lake:
    needs: changes
    if: needs.changes.outputs.lake == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: analytics/lake } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }   # Spark runs on the JVM
      - uses: astral-sh/setup-uv@v8.1.0   # v8 has no moving major tag: pin a full version
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest

  # The one check main requires. Skipped jobs count as passed;
  # failed or cancelled ones don't.
  ci-ok:
    needs: [changes, secrets, chat, game, proto, bots, lambda, infra, deploy, lake]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all required jobs passed or were skipped"
