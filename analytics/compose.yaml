# The analytics side-car, on top of the app. From the repo root:
#   docker compose -f docker-compose.yml -f analytics/compose.yaml up --build
# Paths here are relative to the repo root, the folder of the first file.
services:
  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller # one node does both jobs
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168 # keep a week of changes
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 12

  connect:
    image: quay.io/debezium/connect:3.7
    depends_on:
      kafka: { condition: service_healthy }
      db: { condition: service_healthy }
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: botchat-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: -Xms256m -Xmx768m
      # Connector configs say ${env:NAME} and the worker fills them in, so the same JSON
      # works everywhere and passwords never go through the REST API.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      CDC_DB_HOST: db
      CDC_DB_USER: debezium
      CDC_DB_PASSWORD: dev-cdc # local only, like the other Compose passwords
      CDC_DB_SSLMODE: disable
      CDC_DB_SSLROOTCERT: ""
    ports:
      - "127.0.0.1:8083:8083" # the REST API, for scripts/connectors.sh

  airflow:
    build: analytics/lake
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      LAKE_CATALOG: local
      LAKE_WAREHOUSE: file:///lake/warehouse
      KAFKA_BOOTSTRAP: kafka:9092
      RECONCILE_DB_URL: postgresql://debezium:dev-cdc@db:5432/chat
    volumes:
      - airflow:/opt/airflow
      - lake:/lake
    ports:
      - "127.0.0.1:8080:8080" # the Airflow UI

volumes:
  kafka:
  airflow:
  lake:
