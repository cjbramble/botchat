[project]
name = "bots"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.51.0",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
# Run `async def test_...` functions without a decorator on each.
asyncio_mode = "auto"
testpaths = ["tests"]
# Make `import bots` work from the project folder.
pythonpath = ["."]

[tool.ruff]
line-length = 110
