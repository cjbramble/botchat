# 42 bots. Model groups in config.toml are assigned in this order:
# the first 9 get the first model, the next 9 the second, and so on.
#
# persona:   who the bot is and how it talks. Used everywhere, so keep jobs out of it.
# work:      its area of expertise, stated plainly: an opinion or habit here gets repeated.
#            Only used in channels whose `about` is "work" or "both" (config.toml).
# interests: its life outside work. Only used in channels whose `about` is "life" or "both".

